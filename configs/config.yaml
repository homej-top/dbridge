# Pro-only features removed in Community edition
# (ai and subscription sections removed)
cors:
    allow_credentials: true
    allowed_headers:
        - Content-Type
        - Authorization
    allowed_methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
    allowed_origins:
        - http://localhost:5174
        - http://localhost:8083
    enabled: true
    exposed_headers:
        - Content-Length
    max_age: 86400
crypto:
    key_id: default
database:
    mysql:
        charset: utf8mb4
        conn_max_idle_time: 30m
        conn_max_lifetime: 1h
        database: dbridge
        host: 127.0.0.1
        max_idle_conns: 50
        max_open_conns: 200
        password: 123456
        port: 3306
        username: root
    postgresql:
        conn_max_idle_time: 30m
        conn_max_lifetime: 1h
        database: dbridge
        host: localhost
        max_idle_conns: 50
        max_open_conns: 200
        password: ""
        port: 5432
        ssl_mode: disable
        username: postgres
    sqlite:
        path: ./data/dbridge.db
    type: sqlite
jwt:
    expires_in: 7200
    secret: change-me-in-production
log:
    file_path: ./logs/dbridge.log
    format: console
    level: debug
    output: stdout
nats:
    jetstream: true
    max_msg_size: 65536
    msg_retention: 24h
    url: nats://localhost:4222
cache:
    backend: local            # local | redis
    default_ttl: 300          # 秒（int）；业务未显式给 TTL 时使用
    fallback_local: true      # 仅初始化降级；单机部署用 true，集群多实例建议 false
    local_max_items: 100000   # local 最大 key 数；0 = 不限制（仅依赖 TTL 过期清理）
    redis:
        addr: 127.0.0.1:6379
        db: 0
        password: "123456"
        pool_size: 100
server:
    env: development
    port: 8083
    read_timeout: 30s
    write_timeout: 300s
storage:
    limits:
        max_dir_depth: 10
        max_single_file: 524288000
        total_quota: 0
        upload_allow_types:
            - .db
            - .sql
            - .csv
            - .json
            - .xml
            - .log
            - .txt
            - .gz
            - .zip
            - .sqlite
            - .sqlite3
    temporary_profile: ""
sync:
    batch_size: 5000
    ddl_timeout: 300s
    lock_timeout: 30s
    max_retry: 3
    retry_intervals:
        - 5m
        - 15m
        - 30m
    small_table_threshold: 100000
